services:
  # ============================================================================
  # OPTION 1 (Recommended): Unified Full-Stack Service
  # Free tier friendly: Runs both React frontend and FastAPI backend on 1 service!
  # ============================================================================
  - type: web
    name: skillmatch-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./job_matcher.db
    healthCheckPath: /api/health
